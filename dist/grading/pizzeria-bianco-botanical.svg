tart" fill="#75816b">Italian fontina wrapped in Prosciutto di Parma.</text><text x="157" y="313.2523" font-size="11.18" font-family="'Times New Roman', Times, serif" font-weight="normal" font-style="normal" text-anchor="start" fill="#354e3c">Antipasto</text><text x="543.28" y="313.2523" font-size="11.18" font-family="'Times New Roman', Times, serif" font-weight="normal" font-style="normal" text-anchor="end" fill="#354e3c">$16.00</text><text x="157" y="328.2211" font-size="8.17" font-family="'Times New Roman', Times, serif" font-weight="normal" font-style="normal" text-anchor="start" fill="#75816b">Wood-roasted vegetables, sopressata and a bite of cheese. After 4pm.</text><text x="157" y="368.21059999999994" font-size="16.34" font-family="'Times New Roman', Times, serif" font-weight="normal" font-style="italic" text-anchor="start" fill="#476147">Salads</text><text x="157" y="396.5046" font-size="11.18" font-family="'Times New Roman', Times, serif" font-weight="normal" font-style="normal" text-anchor="start" fill="#354e3c">Local Organic Greens</text><text x="543.28" y="396.5046" font-size="11.18" font-family="'Times New Roman', Times, serif" font-weight="normal" font-style="normal" text-anchor="end" fill="#354e3c">$8.00</text><text x="157" y="411.47339999999997" font-size="8.17" font-family="'Times New Roman', Times, serif" font-weight="normal" font-style="normal" text-anchor="start" fill="#75816b">With balsamic vinaigrette.</text><text x="157" y="435.12289999999996" font-size="11.18" font-family="'Times New Roman', Times, serif" font-weight="normal" font-style="normal" text-anchor="start" fill="#354e3c">Handmade Mozzarella</text><text x="543.28" y="435.12289999999996" font-size="11.18" font-family="'Times New Roman', Times, serif" font-weight="normal" font-style="normal" text-anchor="end" fill="#354e3c">$13.00</text><text x="157" y="450.09169999999995" font-size="8.17" font-family="'Times New Roman', Times, serif" font-weight="normal" font-style="normal" text-anchor="start" fill="#75816b">Local market vegetable, basil and extra virgin olive oil.</text><text x="157" y="490.0811999999999" font-size="16.34" font-family="'Times New Roman', Times, serif" font-weight="normal" font-style="italic" text-anchor="start" fill="#476147">Pizza</text><text x="157" y="518.3752" font-size="11.18" font-family="'Times New Roman', Times, serif" font-weight="normal" font-style="normal" text-anchor="start" fill="#354e3c">Marinara</text><text x="543.28" y="518.3752" font-size="11.18" font-family="'Times New Roman', Times, serif" font-weight="normal" font-style="normal" text-anchor="end" fill="#354e3c">$18.00</text><text x="157" y="533.3439999999999" font-size="8.17" font-family="'Times New Roman', Times, serif" font-weight="normal" font-style="normal" text-anchor="start" fill="#75816b">Tomato sauce, oregano and garlic. No cheese.</text><text x="157" y="556.9934999999999" font-size="11.18" font-family="'Times New Roman', Times, serif" font-weight="normal" font-style="normal" text-anchor="start" fill="#354e3c">Margherita</text><text x="543.28" y="556.9934999999999" font-size="11.18" font-family="'Times New Roman', Times, serif" font-weight="normal" font-style="normal" text-anchor="end" fill="#354e3c">$22.00</text><text x="157" y="571.9622999999999" font-size="8.17" font-family="'Times New Roman', Times, serif" font-weight="normal" font-style="normal" text-anchor="start" fill="#75816b">Tomato sauce, fresh mozzarella and basil.</text><text x="157" y="595.6117999999999" font-size="11.18" font-family="'Times New Roman', Times, serif" font-weight="normal" font-style="normal" text-anchor="start" fill="#354e3c">Sonny Boy</text><text x="543.28" y="595.6117999999999" font-size="11.18" font-family="'Times New Roman', Times, serif" font-weight="normal" font-style="normal" text-anchor="end" fill="#354e3c">$26.00</text><text x="157" y="610.5805999999999" font-size="8.17" font-family="'Times New Roman', Times, serif" font-weight="normal" font-style="normal" text-anchor="start" fill="#75816b">Tomato sauce, fresh mozzarella, salami and Gaeta olives.</text><text x="157" y="634.2300999999999" font-size="11.18" font-family="'Times New Roman', Times, serif" font-weight="normal" font-style="normal" text-anchor="start" fill="#354e3c">Rosa</text><text x="543.28" y="634.2300999999999" font-size="11.18" font-family="'Times New Roman', Times, serif" font-weight="normal" font-style="normal" text-anchor="end" fill="#354e3c">$23.00</text><text x="157" y="649.1988999999999" font-size="8.17" font-family="'Times New Roman', Times, serif" font-weight="normal" font-style="normal" text-anchor="start" fill="#75816b">Red onion, Parmigiano Reggiano, rosemary and Arizona pistachios.</text><text x="157" y="672.8483999999999" font-size="11.18" font-family="'Times New Roman', Times, serif" font-weight="normal" font-style="normal" text-anchor="start" fill="#354e3c">Biancoverde</text><text x="543.28" y="672.8483999999999" font-size="11.18" font-family="'Times New Roman', Times, serif" font-weight="normal" font-style="normal" text-anchor="end" fill="#354e3c">$24.00</text><text x="157" y="687.8171999999998" font-size="8.17" font-family="'Times New Roman', Times, serif" font-weight="normal" font-style="normal" text-anchor="start" fill="#75816b">Fresh mozzarella, Parmigiano Reggiano, ricotta and arugula.</text><text x="157" y="711.4666999999998" font-size="11.18" font-family="'Times New Roman', Times, serif" font-weight="normal" font-style="normal" text-anchor="start" fill="#354e3c">Wiseguy</text><text x="543.28" y="711.4666999999998" font-size="11.18" font-family="'Times New Roman', Times, serif" font-weight="normal" font-style="normal" text-anchor="end" fill="#354e3c">$26.00</text><text x="157" y="726.4354999999998" font-size="8.17" font-family="'Times New Roman', Times, serif" font-weight="normal" font-style="normal" text-anchor="start" fill="#75816b">Wood-roasted onion, house-smoked mozzarella and fennel sausage.</text><line x1="157" y1="766.89" x2="543.28